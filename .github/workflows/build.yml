name: Gerar instaladores

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_TAG: v1.8.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixar whisper.cpp
        shell: bash
        run: git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp wsrc

      # Windows: DLLs com todas as variantes de CPU (roda em processador antigo ou novo),
      # sem OpenMP e com runtime estático, para não exigir instalar nada além do ADV Transcrição.
      - name: Compilar whisper-cli (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S wsrc -B wsrc/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF
          cmake --build wsrc/build --config Release -j 4 --target whisper-cli
          cmake --build wsrc/build --config Release -j 4
          mkdir -p bin
          cp wsrc/build/bin/Release/whisper-cli.exe bin/
          cp wsrc/build/bin/Release/*.dll bin/
          ls -la bin

      # Mac: binário único com Metal (GPU) embutido.
      - name: Compilar whisper-cli (Mac)
        if: runner.os == 'macOS'
        run: |
          cmake -S wsrc -B wsrc/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF
          cmake --build wsrc/build --config Release -j 4 --target whisper-cli
          mkdir -p bin
          cp wsrc/build/bin/whisper-cli bin/
          ls -la bin

      - name: Testar o transcritor
        shell: bash
        run: |
          python3 -c "import wave,struct,math;w=wave.open('t.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(16000);w.writeframes(b''.join(struct.pack('<h',int(3000*math.sin(i/10))) for i in range(48000)));w.close()" || python -c "import wave,struct,math;w=wave.open('t.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(16000);w.writeframes(b''.join(struct.pack('<h',int(3000*math.sin(i/10))) for i in range(48000)));w.close()"
          ./bin/whisper-cli -m wsrc/models/for-tests-ggml-tiny.bin -f t.wav -l pt -oj -of t
          test -s t.json && echo "transcritor OK"

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Gerar instalador
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: advtranscricao-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    # publica o que tiver sido gerado, mesmo que um dos sistemas falhe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler versão
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Conferir arquivos
        run: ls -la out && test -n "$(ls out)"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ADV Transcrição ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            ## Como instalar

            **Windows:** baixe o arquivo `ADVTranscricao-Windows-Setup` (.exe) e abra. Se aparecer "O Windows protegeu o computador", clique em **Mais informações** e depois em **Executar assim mesmo**.

            **Mac com chip Apple (M1 a M4):** baixe o `ADVTranscricao-Mac-arm64` (.dmg) e arraste o ADV Transcrição para Aplicativos. Na primeira vez, se o Mac disser que não pode verificar o desenvolvedor, vá em Ajustes do Sistema › Privacidade e Segurança e clique em **Abrir mesmo assim**.

            Na primeira abertura, vá na aba **Motor** e baixe o modelo de voz (uma vez só).
